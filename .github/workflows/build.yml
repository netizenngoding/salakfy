name: Build Salakfy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build ${{ matrix.task }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE }}
    strategy:
      fail-fast: false
      matrix:
        task:
          - assembleGmsMobileArm64Release
          - assembleGmsMobileUniversalRelease
          - assembleFossMobileUniversalRelease
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_B64" | base64 -d > app/keystore/release.keystore

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.task }} --no-daemon
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salakfy-${{ matrix.task }}
          path: app/build/outputs/apk/**/*.apk
